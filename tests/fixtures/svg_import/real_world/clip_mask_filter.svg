<svg xmlns="http://www.w3.org/2000/svg" width="200" height="110">
  <defs>
    <clipPath id="roundClip"><circle cx="50" cy="50" r="30"/></clipPath>
    <mask id="fade"><rect width="100" height="100" fill="white"/></mask>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect id="clipped" x="10" y="10" width="80" height="80" clip-path="url(#roundClip)" fill="#55ccaa"/>
  <rect id="masked" x="110" y="10" width="70" height="80" mask="url(#fade)" filter="url(#blur)" fill="#334455"/>
</svg>
