[package]
name = "rohkai"
version = "0.2.0"
edition = "2021"
description = "RohKai — Rocaille-inspired pure Rust WYSIWYG egui UI designer"

[[bin]]
name = "rohkai"
path = "src/main.rs"

[[example]]
name = "hello_button"
path = "examples/hello_button/main.rs"

[dependencies]
ab_glyph   = "0.2"
eframe = "0.29"
egui   = "0.29"
rayon      = "1"
rustybuzz  = "0.20"
rfd        = "0.14"
rusqlite   = { version = "0.40", features = ["bundled"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 2
