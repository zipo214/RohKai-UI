name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt

      - name: Check toolchain and export version alignment
        shell: pwsh
        run: ./scripts/check-toolchain-alignment.ps1

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release executable
        run: cargo build --release

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: rohkai-windows-exe
          path: target/release/rohkai.exe
